<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: centred, three soft colour fields drifting behind a glass composer. Transform-only motion. */
:root{
  --bg:#FFFFFF; --ink:#1B1D24; --muted:#6F7380; --line:rgba(27,29,36,.08);
  --mint:rgba(150,228,204,.6); --lav:rgba(196,181,253,.55); --peach:rgba(255,206,178,.6);
  --display:"Cormorant Garamond", "Cormorant", Georgia, serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
.blob{position:absolute;width:62vmax;height:62vmax;border-radius:50%;pointer-events:none;will-change:transform;opacity:0;animation:appear 1.6s ease forwards}
.b1{left:-18vmax;top:-22vmax;background:radial-gradient(circle at 50% 50%,var(--mint) 0,rgba(150,228,204,0) 62%);animation:appear 1.6s ease forwards,d1 26s ease-in-out infinite alternate}
.b2{right:-20vmax;top:-10vmax;background:radial-gradient(circle at 50% 50%,var(--lav) 0,rgba(196,181,253,0) 62%);animation:appear 1.6s ease .2s forwards,d2 32s ease-in-out infinite alternate}
.b3{left:14vmax;bottom:-34vmax;background:radial-gradient(circle at 50% 50%,var(--peach) 0,rgba(255,206,178,0) 62%);animation:appear 1.6s ease .4s forwards,d3 38s ease-in-out infinite alternate}
@keyframes appear{to{opacity:1}}
@keyframes d1{to{transform:translate(14vmax,10vmax) scale(1.12)}}
@keyframes d2{to{transform:translate(-16vmax,14vmax) scale(.92)}}
@keyframes d3{to{transform:translate(18vmax,-12vmax) scale(1.08)}}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px max(28px,env(safe-area-inset-left));font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:0;animation:appear 1s .4s ease forwards}
.top b{color:var(--ink);font-weight:600}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-left));text-align:center}
h1{font:400 clamp(36px,5vw,58px)/1.1 var(--display);margin:0 0 8px;letter-spacing:.1em;opacity:0;animation:track 1.4s cubic-bezier(.2,.7,.2,1) .3s forwards;text-wrap:balance}
h1 em{font-style:italic}
@keyframes track{to{letter-spacing:-.01em;opacity:1}}
.sub{margin:0 0 34px;color:var(--muted);font-size:16px;opacity:0;animation:appear .8s 1.1s ease forwards}
.composer{width:min(100%,700px);text-align:left;background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:0;box-shadow:0 20px 60px -30px rgba(27,29,36,.25),inset 0 1px 0 rgba(255,255,255,.8);opacity:0;transform:translateY(18px) scale(.985);animation:lift .9s cubic-bezier(.2,.7,.2,1) 1s forwards;transition:border-color .3s,box-shadow .3s}
.composer:focus-within{border-color:rgba(27,29,36,.2);box-shadow:0 28px 70px -30px rgba(27,29,36,.32),inset 0 1px 0 rgba(255,255,255,.9)}
@keyframes lift{to{opacity:1;transform:none}}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font:16px/1.5 var(--body);color:var(--ink);padding:18px 20px 6px;min-height:58px;max-height:220px}
textarea::placeholder{color:#9B9FAB}
.row{display:flex;align-items:center;gap:6px;padding:8px 10px 10px}
.ib{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 9px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:0;font:600 13px var(--body);gap:6px;transition:background .15s,color .15s}
.ib:hover{background:rgba(27,29,36,.06);color:var(--ink)}
.ib:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.send{height:32px;width:32px;border:0;background:rgba(27,29,36,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;transition:background .3s,transform .2s}
.send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send.on{background:var(--ink)}
.send:active{transform:scale(.95)}
.send:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px;padding:0;list-style:none}
.chips li{opacity:0;animation:appear .6s ease forwards}
.chips button{font:500 13px var(--body);color:var(--ink);background:rgba(255,255,255,.55);border:1px solid var(--line);padding:8px 14px;cursor:pointer;border-radius:0;animation:bob 6s ease-in-out infinite;transition:background .2s,border-color .2s,transform .2s}
.chips button:hover{background:#fff;border-color:rgba(27,29,36,.25)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.b1,.b2,.b3{opacity:1}}
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>
<div class="top"><b>Lyfestyle</b><span id="date"></span></div>
<main>
  <h1 id="greet"></h1>
  <p class="sub">Ask, plan, write, or pull up anything you have saved.</p>
  <div class="composer">
    <textarea id="prompt" rows="1" placeholder="How can I help you today?" aria-label="Message the core agent"></textarea>
    <div class="row">
      <button class="ib" type="button" title="Attach"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" type="button" title="Tools"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <span class="sp"></span>
      <button class="ib" type="button">Core agent <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="send" id="send" type="button" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <ul class="chips">
    <li style="animation-delay:1.4s"><button type="button" style="animation-delay:.2s">Plan today</button></li>
    <li style="animation-delay:1.5s"><button type="button" style="animation-delay:1.1s">Morning briefing</button></li>
    <li style="animation-delay:1.6s"><button type="button" style="animation-delay:2s">Open yesterday's notes</button></li>
    <li style="animation-delay:1.7s"><button type="button" style="animation-delay:.7s">What did I save this week?</button></li>
  </ul>
</main>
<script>
const USER_NAME = 'Alex';
const h = new Date().getHours();
const part = h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
document.getElementById('greet').innerHTML = `${part}, <em>${USER_NAME}</em>`;
document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const ta = document.getElementById('prompt'), send = document.getElementById('send');
const size = () => { ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,220)+'px'; send.classList.toggle('on', ta.value.trim().length>0); };
ta.addEventListener('input', size);
ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
send.addEventListener('click', submit);
function submit(){ if(!ta.value.trim()) return; ta.value=''; size(); ta.focus(); }
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => { ta.value = b.textContent; size(); ta.focus(); }));
</script>
</body>
</html>

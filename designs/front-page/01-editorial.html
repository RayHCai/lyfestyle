<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500&display=swap">
<style>
/* Layout: a quiet magazine column. Hairline masthead, one centred column, words rise out of a mask. */
:root{
  --bg:#FBFAF7; --ink:#1C1B19; --muted:#7A766E; --line:#E4E1DA; --card:#FFFFFF; --accent:#2B4C7E;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mast{display:flex;justify-content:space-between;align-items:center;padding:18px max(24px,env(safe-area-inset-left)) 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative;opacity:0;animation:fade .6s .2s ease forwards}
.mast b{color:var(--ink);font-weight:500;letter-spacing:.2em}
.mast::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--line);transform:scaleX(0);transform-origin:left;animation:rule .9s cubic-bezier(.77,0,.18,1) .1s forwards}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-left)) 64px}
.col{width:100%;max-width:720px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;opacity:0;animation:fade .6s .5s ease forwards}
h1{font:italic 400 clamp(32px,4.2vw,46px)/1.15 var(--display);margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
h1 .w span{display:inline-block;transform:translateY(110%);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.sub{margin:0 0 30px;color:var(--muted);font-size:16px;opacity:0;animation:fade .6s 1s ease forwards}
.composer{background:var(--card);border:1px solid var(--line);border-radius:0;opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.2,.7,.2,1) .9s forwards;transition:box-shadow .3s ease,border-color .3s ease}
.composer:focus-within{border-color:#CFCBC2;box-shadow:0 18px 40px -24px rgba(28,27,25,.25),0 1px 0 rgba(28,27,25,.03)}
textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font:16px/1.5 var(--body);color:var(--ink);padding:18px 20px 6px;min-height:58px;max-height:220px}
textarea::placeholder{color:#A6A299}
.row{display:flex;align-items:center;gap:6px;padding:8px 10px 10px}
.ib{display:inline-flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:0 8px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:0;font:500 13px var(--body);gap:6px;transition:background .15s,color .15s}
.ib:hover{background:#F2F0EA;color:var(--ink)}
.ib:focus-visible{outline:1.5px solid var(--accent);outline-offset:1px}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.send{height:32px;width:32px;border:0;background:#DAD7CF;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,transform .2s;border-radius:0}
.send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.send.on{background:var(--ink)}
.send.on:hover svg{transform:translateY(-2px)}
.send:active{transform:scale(.96)}
.send:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.sugg{display:flex;flex-wrap:wrap;gap:8px 28px;margin:22px 2px 0;list-style:none;padding:0}
.sugg li{opacity:0;animation:fade .5s ease forwards}
.sugg a{color:var(--ink);text-decoration:none;font-size:14px;background:linear-gradient(var(--accent),var(--accent)) no-repeat 0 100%/100% 1px;padding-bottom:3px;transition:background-size .25s ease,color .2s}
.sugg a:hover{background-size:100% 2px;color:var(--accent)}
@keyframes fade{to{opacity:1}}
@keyframes rule{to{transform:scaleX(1)}}
@keyframes rise{to{transform:translateY(0)}}
@keyframes up{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="mast"><b>Lyfestyle</b><span id="date"></span></header>
<main>
  <div class="col">
    <p class="eyebrow" id="eyebrow">Your day at a glance</p>
    <h1 id="greet"></h1>
    <p class="sub">What would you like to take care of?</p>
    <div class="composer">
      <textarea id="prompt" rows="1" placeholder="How can I help you today?" aria-label="Message the core agent"></textarea>
      <div class="row">
        <button class="ib" type="button" title="Attach"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ib" type="button" title="Tools"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
        <span class="sp"></span>
        <button class="ib" type="button">Core agent <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="send" id="send" type="button" title="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <ul class="sugg">
      <li style="animation-delay:1.25s"><a href="#">Plan my day</a></li>
      <li style="animation-delay:1.35s"><a href="#">Summarise unread news</a></li>
      <li style="animation-delay:1.45s"><a href="#">Find my notes on Tauri</a></li>
    </ul>
  </div>
</main>
<script>
const USER_NAME = 'Alex';
const h = new Date().getHours();
const part = h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
const text = `${part}, ${USER_NAME}.`;
const greet = document.getElementById('greet');
greet.innerHTML = text.split(' ').map((w,i)=>`<span class="w"><span style="animation-delay:${.55+i*.09}s">${w}</span></span>`).join(' ');
document.getElementById('date').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
const ta = document.getElementById('prompt'), send = document.getElementById('send');
const size = () => { ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,220)+'px'; send.classList.toggle('on', ta.value.trim().length>0); };
ta.addEventListener('input', size);
ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
send.addEventListener('click', submit);
function submit(){ if(!ta.value.trim()) return; ta.value=''; size(); ta.focus(); }
document.querySelectorAll('.sugg a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); ta.value = a.textContent; size(); ta.focus(); }));
</script>
</body>
</html>

# Builds the Windows installer and attaches it to a draft GitHub release.
# Trigger: push a tag like `desktop-v0.2.0`, matching the version in
# apps/desktop/src-tauri/tauri.conf.json and Cargo.toml, or run it by hand and name an existing tag.
name: Release desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. desktop-v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  # A manual run's ref is a branch; only the tag names the release.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Lint, format, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Tag is a desktop release
        run: |
          case "$TAG" in
            desktop-v*) ;;
            *) echo "::error::$TAG is not a desktop-v* tag"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "desktop-v$version" ]; then
            echo "::error::$TAG does not match tauri.conf.json's version $version"
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @lyfestyle/desktop...
      # tauri::generate_context! embeds the built frontend, so it has to exist before clippy.
      - run: pnpm --filter @lyfestyle/desktop build
      - run: pnpm lint:rust
      - run: pnpm test:rust
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundle; installed apps reject an update without a valid signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ env.TAG }}
          releaseName: Lyfestyle ${{ env.TAG }}
          releaseDraft: true
          prerelease: false
          # latest.json is what installed apps poll for updates.
          includeUpdaterJson: true
